<style>
  :root{
    --paper:#fff3e6;
    --paper-alt:#ffe8cc;
    --paper-raised:#ffffff;
    --ink:#092d58;
    --ink-soft:#5c6f88;
    --line:#f2c9a3;
    --line-strong:#e9b47a;
    --accent:#f76204;
    --accent-strong:#d14f02;
    --accent-ink:#ffffff;
    --danger:#c23b2c;
    --shadow-sm: 0 1px 2px rgba(9,45,88,.06), 0 1px 1px rgba(9,45,88,.05);

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0e1620;
      --paper-alt:#131d29;
      --paper-raised:#182432;
      --ink:#eef2f7;
      --ink-soft:#93a3b8;
      --line:#28394c;
      --line-strong:#3c5068;
      --accent:#ff7a1f;
      --accent-strong:#ff9245;
      --accent-ink:#1c0f03;
      --danger:#ff6b5a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow: 0 8px 22px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
      --shadow-lg: 0 20px 45px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.35);
      --focus:#ff9245;
      --focus-ring: rgba(255,122,31,.28);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1620;
    --paper-alt:#131d29;
    --paper-raised:#182432;
    --ink:#eef2f7;
    --ink-soft:#93a3b8;
    --line:#28394c;
    --line-strong:#3c5068;
    --accent:#ff7a1f;
    --accent-strong:#ff9245;
    --accent-ink:#1c0f03;
    --danger:#ff6b5a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: 0 8px 22px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg: 0 20px 45px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.35);

  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; touch-action:pan-x pan-y; }
  html{ scrollbar-color: var(--line-strong) transparent; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:20px; border:2px solid var(--paper); }
  h1,h2,h3{ font-family:"Anton", "Arial Narrow", sans-serif; font-weight:400; letter-spacing:.03em; text-transform:uppercase; margin:0 0 4px; text-wrap:balance;}
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; transition:background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), transform .12s var(--ease), box-shadow .16s var(--ease); }
  button:active{ transform:scale(.97); }
  a{ color:var(--accent); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

  .shell{ min-height:100vh; display:flex; flex-direction:column; }

    display:flex; align-items:center; justify-content:space-between;

  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-text{ display:flex; flex-direction:column; min-width:0; gap:1px; }

  .brand-logo{ width:40px; height:40px; object-fit:contain; flex:none; border-radius:10px; background:var(--paper-raised); padding:3px; box-shadow:var(--shadow-sm); }
  .sync-badge{ font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-soft); flex:none; box-shadow:0 0 0 3px transparent; transition:box-shadow .2s var(--ease); }

  .sync-dot.warn{ background:#c98a2e; box-shadow:0 0 0 3px rgba(201,138,46,.18); }
  .icon-btn{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); width:38px; height:38px; font-size:16px; box-shadow:var(--shadow-sm); }
  .icon-btn:hover{ background:var(--paper); border-color:var(--line-strong); }
  button.sync-badge{ background:transparent; border:none; padding:3px 6px; margin:0; font:inherit; border-radius:6px; }
  button.sync-badge:hover{ background:var(--paper-raised); }

  .body{ flex:1; display:flex; min-height:0; }
  .tabbar{ display:flex; gap:2px; background:var(--paper-alt); border-top:1px solid var(--line); z-index:20; box-shadow:0 -6px 16px rgba(9,45,88,.08); }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; padding:9px 4px 8px; font-size:10.5px; font-weight:500; color:var(--ink-soft);
    border-top:2px solid transparent; position:relative;
  }
  .tab-btn .ic{ font-size:18px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
  .tab-btn .ic svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; transition:transform .18s var(--ease); }
  .tab-btn.active{ color:var(--accent); border-top-color:var(--accent); }

  @media (min-width:860px){

      border-top:none; border-right:1px solid var(--line); padding:16px 10px; gap:3px; box-shadow:none; }
    .tab-btn{ flex-direction:row; justify-content:flex-start; gap:12px; padding:11px 14px; font-size:14px; border-top:none; border-left:none; border-radius:var(--r-sm); }
    .tab-btn.active{ background:var(--paper-raised); box-shadow:var(--shadow-sm); }
    .tab-btn.active .ic svg{ transform:none; }

  }
  @media (max-width:859px){
    .tabbar{ position:fixed; bottom:0; left:0; right:0; padding-bottom:env(safe-area-inset-bottom); }
  }

  .section-title{ font-size:21px; margin-bottom:3px; }
  .section-sub{ color:var(--ink-soft); font-size:13px; margin-bottom:20px; line-height:1.5; }

  .today-strip{ display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,var(--paper-alt),var(--paper)); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 18px; margin-bottom:18px; font-size:14px; box-shadow:var(--shadow-sm); }
  .today-strip .amt{ font-weight:600; color:var(--accent); font-size:17px; }
  /* Marca de agua: usuario, negocio y fecha repetidos en toda la pantalla (sale en cualquier captura). */
  #marca-agua{ position:fixed; inset:0; z-index:2147483000; pointer-events:none; background-repeat:repeat; }
  #servicio-aviso{ position:fixed; left:0; right:0; top:0; z-index:2147482999; background:#b3261e; color:#fff; font-size:13px; font-weight:600; text-align:center; padding:7px 12px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  #servicio-aviso.info{ background:#092d58; }
  #servicio-bloqueo{ position:fixed; inset:0; z-index:2147483001; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 24px; gap:12px; }
  #servicio-bloqueo img{ width:110px; height:110px; object-fit:contain; margin-bottom:6px; }

  #servicio-bloqueo p{ max-width:360px; margin:0; color:var(--ink); font-size:15px; line-height:1.45; }
  #servicio-bloqueo .tel{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:17px; color:var(--accent); }

  .backup-hint{ display:flex; justify-content:space-between; align-items:center; gap:12px; background:transparent; border:1px dashed var(--line-strong); border-radius:var(--r-md); padding:11px 16px; margin-bottom:18px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap; }

  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-md); padding:18px; box-shadow:var(--shadow); }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .field input, .field textarea{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; font-size:15px; color:var(--ink);
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .field input:focus, .field textarea:focus{ border-color:var(--focus); box-shadow:0 0 0 3.5px var(--focus-ring); }
  .field input::placeholder, .field textarea::placeholder{ color:var(--ink-soft); opacity:.65; }

  .ac-wrap{ position:relative; }
  .ac-list{ position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--r-md); max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; z-index:40; box-shadow:var(--shadow-lg); animation:popIn .14s var(--ease); }
  .ac-item{ padding:10px 13px; font-size:14px; border-bottom:1px dashed var(--line); transition:background-color .12s var(--ease); }
  .ac-item:last-child{ border-bottom:none; }
  .ac-item:hover, .ac-item:active{ background:var(--paper-alt); }
  .ac-item .sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }

  .ac-list.ac-list-overlay{ position:fixed !important; left:auto; right:auto; margin-top:0; }
  .ac-list-overlay .ac-item{ padding:15px 18px; font-size:16px; }
  .ac-list-overlay .ac-item .sub{ font-size:13px; margin-top:3px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  .pay-toggle{ display:flex; gap:8px; flex-wrap:wrap; }
  .pay-opt{ flex:1 1 100px; text-align:center; border:1px solid var(--line); background:var(--paper); border-radius:var(--r-sm); padding:10px 10px; font-size:14px; font-weight:500; color:var(--ink-soft); }
  .pay-opt:hover{ border-color:var(--line-strong); }
  .pay-opt.on{ background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); box-shadow:0 4px 12px rgba(247,98,4,.28); }
  .pay-opt.yape{ border-color:#a276c4; color:#742284; }
  .pay-opt.yape.on{ background:#742284; border-color:#5c1a69; color:#fff; box-shadow:0 4px 12px rgba(116,34,132,.35); }
  .pay-opt.plin{ border-color:#7fe0d8; color:#049a91; }
  .pay-opt.plin.on{ background:#00c1b6; border-color:#049a91; color:#06322f; box-shadow:0 4px 12px rgba(0,193,182,.35); }
  .pay-tag{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:2.5px 8px; border-radius:20px; border:1px solid var(--line-strong); color:var(--ink-soft); white-space:nowrap; font-weight:600; }
  .pay-tag.efectivo{ background:var(--paper-alt); }
  .pay-tag.banco{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pay-tag.yape{ background:#742284; color:#fff; border-color:#742284; }
  .pay-tag.plin{ background:#00c1b6; color:#06322f; border-color:#00c1b6; }
  .pay-tag.mixto{ background:var(--paper-alt); color:var(--ink); border-color:var(--line-strong); }
  .pay-tag.pendiente{ background:transparent; color:var(--danger); border-color:var(--danger); font-weight:600; }
  .pay-tag.parcial{ background:transparent; color:#b8790a; border-color:#b8790a; font-weight:600; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink); padding:10px 18px; border-radius:var(--r-sm); font-size:14px; font-weight:500; box-shadow:var(--shadow-sm); }
  .btn:hover{ background:var(--paper-alt); border-color:var(--line-strong); }
  .btn-primary{ background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); box-shadow:0 4px 14px rgba(247,98,4,.32); }
  .btn-primary:hover{ background:var(--accent-strong); box-shadow:0 6px 18px rgba(247,98,4,.4); }
  .btn-danger{ color:var(--danger); border-color:var(--danger); background:transparent; box-shadow:none; }
  .btn-danger:hover{ background:rgba(194,59,44,.08); }
  .abono-monto{ width:88px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); padding:7px 8px; font-size:13.5px; color:var(--ink); text-align:right; }
  .abono-monto:focus{ border-color:var(--focus); box-shadow:0 0 0 3px var(--focus-ring); }
  .btn.yape{ border-color:#742284; color:#742284; }
  .btn.yape:hover{ background:rgba(116,34,132,.1); }
  .btn.plin{ border-color:#049a91; color:#049a91; }
  .btn.plin:hover{ background:rgba(0,193,182,.12); }
  .btn-ghost{ border-color:transparent; background:transparent; padding:6px 8px; box-shadow:none; }
  .btn-ghost:hover{ background:rgba(9,45,88,.06); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:none; }

  .items-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-sm); }
  table{ width:100%; border-collapse:collapse; min-width:520px; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; color:var(--ink-soft); padding:10px 12px; background:var(--paper-alt); border-bottom:1px solid var(--line); }
  tbody td{ padding:10px 12px; border-bottom:1px dashed var(--line); vertical-align:middle; }
  tbody tr{ transition:background-color .14s var(--ease); }
  tbody tr:hover{ background:var(--paper-alt); }
  tbody tr:last-child td{ border-bottom:none; }
  td input{ width:100%; background:transparent; border:none; border-bottom:1px solid transparent; padding:5px 2px; font-size:14px; color:var(--ink); }
  td input:focus{ border-bottom-color:var(--focus); }
  .item-cod{ display:inline-block; min-width:44px; font-size:12px; font-weight:600; color:var(--accent); margin-right:6px; vertical-align:middle; }
  .item-cod:empty{ display:none; }
  .ac-wrap{ display:flex; align-items:center; }
  .ac-wrap input{ flex:1; min-width:0; }
  .col-cant{ width:78px; } .col-kg{ width:84px; } .col-precio{ width:110px; } .col-sub{ width:110px; } .col-del{ width:38px; }
  /* En celular cada producto es una tarjeta: nombre arriba y Cant / Kg / P.unit / Importe abajo, todo visible. */
  @media (max-width:700px){
    table.items-form{ min-width:0; }
    .items-form thead{ display:none; }
    .items-form tbody tr{ display:grid; grid-template-columns:1fr 1fr 1fr 1.25fr; gap:8px 10px; padding:12px 12px 14px; position:relative; border-bottom:1px dashed var(--line); }
    .items-form tbody td{ display:block; width:auto !important; padding:0; border:none; }
    .items-form tbody td:first-child{ grid-column:1 / -1; padding-right:34px; }
    .items-form td[data-label]::before{ content:attr(data-label); display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:2px; }
    .items-form td.col-del{ position:absolute; top:8px; right:8px; }

    .items-form td input{ font-size:16px; border-bottom:1px solid var(--line); padding:6px 2px; }
  }
  .vend-box{ margin-bottom:18px; }
  .vend-row{ padding:10px 0; border-bottom:1px dashed var(--line); }
  .vend-row:last-child{ border-bottom:none; }
  .vend-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:15px; }
  .vend-bar{ height:6px; background:var(--paper-alt); border-radius:3px; margin:6px 0 4px; overflow:hidden; }
  .vend-bar span{ display:block; height:100%; background:var(--accent); border-radius:3px; }
  .vend-sub{ font-size:12.5px; color:var(--ink-soft); }
  .sel-wrap{ display:inline-flex; align-items:center; gap:8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; }

  .empty{ color:var(--ink-soft); font-size:14px; padding:26px 4px; text-align:center; }

  details.month{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease); }

  details.month summary::-webkit-details-marker{ display:none; }

  .note-row .amt{ font-family:"IBM Plex Mono",monospace; font-weight:600; white-space:nowrap; }
  .note-row .go{ background:transparent; border:none; color:var(--accent); font-size:12.5px; font-weight:600; text-decoration:underline; padding:2px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  @media (max-width:480px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
  .stat{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-md); padding:16px 18px; box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease), transform .18s var(--ease); }
  .stat:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
  .stat[data-action]{ cursor:pointer; }
  .stat[data-action]:hover{ border-color:var(--line-strong); }
  .stat[data-action]::after{ content:"Ver detalle ›"; display:block; font-size:10px; color:var(--ink-soft); margin-top:6px; opacity:.7; }
  .stat .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .stat .value{ font-family:"IBM Plex Mono",monospace; font-size:25px; margin-top:5px; font-weight:600; }
  .stat.hi{ border-color:var(--line-strong); }
  .stat.hi .value{ color:var(--accent); }

  .chart-card{ padding:16px 10px 8px; }
  .bar-label{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--ink-soft); }
  .bar-value{ font-family:"IBM Plex Mono",monospace; font-size:10px; fill:var(--ink); }
  .bar-rect{ fill:var(--accent); }
  .axis-line{ stroke:var(--line); stroke-width:1; }

  .prod-table td, .prod-table th{ font-size:14px; }
  .cliente-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 0; border-bottom:1px dashed var(--line); }
  .cliente-row:last-child{ border-bottom:none; }
  .cliente-nombre{ font-size:14.5px; font-weight:500; overflow-wrap:anywhere; min-width:0; flex:1 1 160px; }
  .cliente-acciones{ display:flex; gap:8px; flex:none; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  select.year-select{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; font-size:14px; box-shadow:var(--shadow-sm); }

  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{ width:36px; height:36px; flex:none; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--paper-raised); font-size:16px; color:var(--ink); box-shadow:var(--shadow-sm); }
  .stepper button:hover{ border-color:var(--accent); color:var(--accent); }
  .stepper .stepper-label{ min-width:118px; text-align:center; font-weight:600; font-family:"IBM Plex Mono",monospace; font-size:14px; }

  .overlay{ position:fixed; inset:0; background:rgba(12,10,6,.6); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:26px 14px; overflow-y:auto; z-index:60; animation:fadeIn .16s var(--ease); }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes popIn{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:none; } }
  .calc-modal{ max-width:340px; }
  .calc-screen{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 14px; margin-bottom:12px; text-align:right; min-height:64px; }
  .calc-display{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:22px; word-break:break-all; min-height:28px; }
  .calc-result{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:17px; color:var(--accent-strong); font-weight:600; min-height:22px; }
  .calc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .calc-key{ font-size:20px; padding:13px 0; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--paper-raised); color:var(--ink); cursor:pointer; font-family:inherit; }
  .calc-key.op{ background:var(--paper); color:var(--accent-strong); font-weight:700; } .calc-key.fn{ color:var(--ink-soft); } .calc-key.eq{ grid-column:span 2; background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); font-weight:700; }
  .calc-key:active{ transform:scale(.97); }
  .modal{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px; width:100%; max-width:420px; box-shadow:var(--shadow-lg); animation:popIn .18s var(--ease); }
  .modal h2{ font-size:18px; margin-bottom:16px; }

  .ticket{ background:var(--paper-raised); width:100%; max-width:340px; margin:0 auto; padding:20px 18px; border-top:2px dashed var(--line-strong); border-bottom:2px dashed var(--line-strong); font-family:"IBM Plex Mono",monospace; border-radius:2px; }
  .ticket .biz-logo{ display:block; width:150px; height:150px; object-fit:contain; margin:0 auto 8px; }
  .nota-gruesa .ticket{ font-weight:500; }
  .nota-gruesa .ticket .biz-logo{ width:185px; height:185px; margin-bottom:6px; }
  .ticket .biz{ text-align:center; font-family:"Anton","Arial Narrow",sans-serif; font-size:17px; margin-bottom:2px; }
  .ticket .biz-sub{ text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .ticket .doc-title{ text-align:center; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px; }
  .nota-gruesa .ticket .biz-sub{ font-size:17px; font-weight:700; color:var(--ink); line-height:1.22; margin-bottom:1px; letter-spacing:-.01em; }
  .nota-gruesa .ticket .biz-sub + .doc-title{ margin-top:10px; }
  .nota-gruesa .ticket .doc-title{ font-size:17px; font-weight:700; letter-spacing:.06em; }
  .ticket .corr-stamp{ text-align:center; color:var(--accent); font-size:20px; font-weight:600; transform:rotate(-2deg); margin:4px 0 10px; }
  .ticket .meta{ display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:2px; }
  .ticket .meta span:first-child{ flex-shrink:0; }
  .ticket .meta span:last-child{ min-width:0; text-align:right; overflow-wrap:anywhere; }
  .ticket .ubic-block{ font-size:11px; margin:6px 0 2px; padding-top:4px; border-top:1px dashed var(--line); }
  .ticket .ubic-block strong{ display:block; margin-bottom:2px; }
  .ticket .ubic-block div{ color:var(--ink-soft); line-height:1.4; }
  .ticket .ubic-block a{ display:inline-block; margin-top:3px; font-size:10.5px; color:var(--accent); }
  .ticket hr{ border:none; border-top:1px dashed var(--line); margin:10px 0; }
  .ticket table.tk-items{ width:100%; min-width:0; border-collapse:collapse; table-layout:fixed; margin:3px 0 4px; font-size:10px; border:none; border-bottom:1px solid var(--ink); }
  .ticket .tk-moneda{ font-size:10.5px; font-weight:700; margin-top:10px; }
  .ticket .tk-items th, .ticket .tk-items td{ border:none; padding:4px 2px; text-align:right; vertical-align:middle; background:transparent; white-space:nowrap; letter-spacing:0; text-transform:none; color:var(--ink); }
  .ticket .tk-items th{ font-size:9px; font-weight:700; text-transform:uppercase; border-bottom:1px solid var(--ink); }
  .ticket .tk-items .l{ text-align:left; }
  .ticket .tk-items td.l:nth-child(2){ white-space:normal; overflow-wrap:break-word; }
  .ticket .tk-items tbody tr:hover{ background:transparent; }
  .ticket .tk-items col.c-cod{ width:15%; } .ticket .tk-items col.c-prod{ width:24%; } .ticket .tk-items col.c-cant{ width:11%; } .ticket .tk-items col.c-kg{ width:14%; } .ticket .tk-items col.c-pu{ width:16%; } .ticket .tk-items col.c-tot{ width:20%; }
  .ticket .it{ display:flex; justify-content:space-between; font-size:12.5px; gap:8px; margin-bottom:5px; }
  .ticket .it .nm{ min-width:0; overflow-wrap:anywhere; }
  .ticket .it .qp{ color:var(--ink-soft); font-size:11px; }
  .ticket .total{ display:flex; justify-content:space-between; font-size:16px; font-weight:600; margin-top:10px; }
  .ticket .pago-bloque{ margin-top:8px; padding-top:6px; border-top:1px dashed var(--line); }
  .ticket .foot{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:14px; }
  .ticket .foot.pedidos{ margin-top:8px; color:var(--ink); font-size:12px; }
  .ticket .foot.pedidos strong{ font-size:13px; }
  .ticket .legal{ text-align:center; font-size:9.5px; color:var(--ink-soft); margin-top:6px; }
  .nota-gruesa .ticket .foot, .nota-gruesa .ticket .legal, .nota-gruesa .ticket .ubic-block div, .nota-gruesa .ticket .it .qp{ color:var(--ink); }
  .ticket-actions{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }

  .internal-note{ background:var(--paper-alt); border:1px dashed var(--line-strong); border-radius:var(--r-sm); padding:10px 14px; margin-top:14px; font-size:12.5px; line-height:1.5; }
  .internal-note .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; margin-bottom:4px; }
  .internal-note .txt{ color:var(--ink); }

  .gate{ position:fixed; inset:0; background:radial-gradient(circle at 50% 0%, var(--paper-alt), var(--paper) 60%); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 20px; gap:22px; text-align:center; animation:fadeIn .2s var(--ease); }
  .gate-logo{ width:92px; height:92px; object-fit:contain; filter:drop-shadow(0 10px 20px rgba(9,45,88,.18)); }
  .gate-note{ color:var(--ink-soft); font-size:12.5px; max-width:320px; line-height:1.5; }
  .user-grid{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:460px; }
  .user-chip{ padding:16px 24px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--paper-raised); font-size:15px; font-weight:600; min-width:112px; color:var(--ink); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .user-chip::before{ content:attr(data-initial); width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:"Anton","Arial Narrow",sans-serif; font-size:15px; }
  .user-chip:hover{ border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-2px); }
  .pin-pad{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .pin-input{ font-size:30px; letter-spacing:16px; text-align:center; width:180px; padding:12px 0 12px 16px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper-raised); color:var(--ink); font-family:"IBM Plex Mono",monospace; box-shadow:var(--shadow-sm); }
  .pin-input:focus{ border-color:var(--focus); box-shadow:0 0 0 4px var(--focus-ring); }
  .pin-error{ color:var(--danger); font-size:13px; min-height:16px; font-weight:500; }
  .gate-form{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px; }
  .gate-form input{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px 14px; font-size:15px; color:var(--ink); text-align:center; box-shadow:var(--shadow-sm); }
  .gate-form input:focus{ border-color:var(--focus); box-shadow:0 0 0 3.5px var(--focus-ring); }

  @page{ size:80mm auto; margin:0; }
  @media print{
    html, body{ width:80mm; margin:0; padding:0; background:#fff !important; }
    .overlay{ padding:0 !important; background:#fff !important; backdrop-filter:none !important; display:block !important; }
    .modal{ box-shadow:none !important; border:none !important; padding:0 !important; max-width:80mm !important; width:80mm !important; border-radius:0 !important; animation:none !important; }
    .ticket{ width:72mm !important; max-width:72mm !important; margin:0 auto !important; padding:3mm 0 12mm !important; color:#000 !important; background:#fff !important; border-top:none !important; border-bottom:none !important; }
    .ticket *{ color:#000 !important; }
    .ticket .biz-logo{ width:34mm !important; height:34mm !important; margin-bottom:2mm !important; }
    .ticket .biz-sub{ font-size:9pt !important; margin-bottom:1mm !important; }
    .ticket .doc-title{ font-size:10pt !important; }
    .nota-gruesa .ticket{ font-weight:600 !important; }
    .nota-gruesa .ticket .biz-logo{ width:42mm !important; height:42mm !important; margin-bottom:1.5mm !important; }
    .nota-gruesa .ticket .biz-sub{ font-size:12pt !important; font-weight:700 !important; margin-bottom:.4mm !important; }
    .nota-gruesa .ticket .doc-title{ font-size:12.5pt !important; font-weight:700 !important; }
    .ticket .corr-stamp{ font-size:15pt !important; transform:none !important; margin:1mm 0 3mm !important; }
    .ticket .meta{ font-size:9.5pt !important; margin-bottom:1mm !important; gap:3mm; }
    .ticket .meta span:last-child{ text-align:right; overflow-wrap:anywhere; }
    .ticket hr{ border-top:1px solid #000 !important; margin:2.5mm 0 !important; }
    .ticket table.tk-items{ font-size:7pt !important; border:none !important; border-bottom:0.25mm solid #000 !important; }
    .ticket .tk-items th, .ticket .tk-items td{ border:none !important; padding:1mm 0.5mm !important; }
    .ticket .tk-items th{ border-bottom:0.25mm solid #000 !important; }
    .ticket .tk-items th{ font-size:6pt !important; }
    .ticket .it{ font-size:9.5pt !important; margin-bottom:1.8mm !important; gap:3mm !important; }
    .ticket .it > div:last-child{ white-space:nowrap; font-weight:600; }
    .ticket .it .qp{ font-size:8.5pt !important; }
    .ticket .total{ font-size:12pt !important; margin-top:2mm !important; }
    .ticket .pago-bloque{ border-top:1px solid #000 !important; margin-top:2mm !important; padding-top:2mm !important; }
    .ticket .foot{ font-size:9pt !important; margin-top:3mm !important; }
    .ticket .ubic-block{ font-size:8.5pt !important; }
    .ticket .ubic-block a{ display:none !important; }
    body *{ visibility:hidden; }
    #overlay-root, #overlay-root *{ visibility:visible; }
    #overlay-root{ position:absolute; inset:0; background:#fff !important; padding:0; }
    .ticket-actions{ display:none !important; }
    .internal-note{ display:none !important; }
    .ticket{ border:none; max-width:100%; }
  }
</style>
</head>
